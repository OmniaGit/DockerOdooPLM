name: dockerhub-description

# The Docker Hub repository holds every Odoo version, so its overview page is
# synced from this branch (docs/dockerhub-overview.md) instead of from a version
# branch — otherwise 18.0 and 19.0 would overwrite each other's description.

on:
  push:
    branches: [main]
    paths:
      - docs/dockerhub-overview.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

jobs:
  description:
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN live in this environment
    environment: dockerhub
    # the `secrets` context cannot be used in an `if`, so it goes through the
    # job environment, which is available to the step conditions
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Update the Docker Hub overview
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_NAMESPACE != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/odooplm
          readme-filepath: ./docs/dockerhub-overview.md
          short-description: "Odoo + OdooPLM: PLM/PDM server images, one tag per Odoo version"

      - name: Report missing configuration
        if: env.DOCKERHUB_TOKEN == '' || env.DOCKERHUB_NAMESPACE == ''
        run: echo "::warning::DOCKERHUB_TOKEN or DOCKERHUB_NAMESPACE is not configured, skipping the description sync"
