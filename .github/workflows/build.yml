name: build

on:
  push:
    branches: ["20.0"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: ["20.0"]
  # also started every week by weekly.yml on the default branch: a schedule
  # declared here would only fire on the default branch
  workflow_dispatch:

env:
  ODOO_VERSION: "20.0"
  ODOOPLM_REF: "20.0"
  # the "latest" tags stay on 19.0 until the odooplm 20.0 migration is complete
  PUSH_LATEST: "false"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/odooplm
  # set the DOCKERHUB_NAMESPACE variable to publish to Docker Hub as well
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  # what the -demo tags install on first boot
  DEMO_MODULES: plm,plm_spare,plm_web_3d,plm_demo

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN live in this environment; without the
    # declaration the job cannot see them
    environment: dockerhub
    permissions:
      contents: read
      packages: write
    # the `secrets` context cannot be used in an `if`, so it goes through the job
    # environment, which is available to the step conditions
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # the full variant (cadquery/OCP/vtk) does not fit next to the runner's
        # preinstalled toolchains
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Resolve the odooplm commit
        # the clone command never changes, so without this the cached layer would
        # keep the sources from whenever the cache was filled — the weekly rebuild
        # has to see the branch move
        id: sources
        run: |
          sha="$(git ls-remote "https://github.com/OmniaGit/odooplm.git" \
                   "refs/heads/${ODOOPLM_REF}" | cut -f1)"
          if [ -z "$sha" ]; then
            echo "::error::cannot resolve refs/heads/${ODOOPLM_REF} on odooplm"
            exit 1
          fi
          echo "odooplm ${ODOOPLM_REF} is at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: odooplm:ci
          build-args: |
            ODOO_VERSION=${{ env.ODOO_VERSION }}
            ODOOPLM_REF=${{ env.ODOOPLM_REF }}
            ODOOPLM_SHA=${{ steps.sources.outputs.sha }}
            VARIANT=${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test
        run: ./scripts/smoke-test.sh odooplm:ci

      - name: Check the demo modules are installable
        # while odooplm is being migrated some of them are still marked
        # installable: False; the -demo tags are skipped until they all are,
        # rather than failing the whole build
        id: demo
        run: |
          missing="$(docker run --rm -i --entrypoint python3 odooplm:ci - "$DEMO_MODULES" <<'PY'
          import ast, os, sys
          root = os.environ["ODOOPLM_ADDONS"]
          for module in sys.argv[1].split(","):
              path = os.path.join(root, module, "__manifest__.py")
              if os.path.exists(path):
                  with open(path) as fh:
                      if ast.literal_eval(fh.read()).get("installable", True):
                          continue
              print(module)
          PY
          )"
          if [ -n "$missing" ]; then
            echo "::warning::demo modules not installable yet: $(echo $missing), skipping the -demo tags"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the demo variant
        # identical image, only the modules installed on first boot differ, so
        # every layer is shared with the plain tag and the push costs a few kB
        if: steps.demo.outputs.enabled == 'true'
        run: |
          printf 'FROM odooplm:ci\nENV ODOOPLM_DEFAULT_MODULES=%s\n' "$DEMO_MODULES" \
            | docker build -t odooplm:ci-demo -f - .

      - name: Smoke test the demo variant
        if: steps.demo.outputs.enabled == 'true'
        # SMOKE_EXPECT_MODULES, not ODOOPLM_INIT_MODULES: the point is to check
        # that the image installs its own list the way a user would get it
        env:
          COMPOSE_PROJECT_NAME: odooplm-smoke-demo
          ODOO_PORT: "18169"
          ODOO_WEBSOCKET_PORT: "18172"
          SMOKE_EXPECT_MODULES: ${{ env.DEMO_MODULES }}
        run: ./scripts/smoke-test.sh odooplm:ci-demo

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: dockerhub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tags
        if: github.event_name != 'pull_request'
        env:
          VARIANT: ${{ matrix.variant }}
          DOCKERHUB_PUSH: ${{ steps.dockerhub.outcome == 'success' }}
          DEMO_ENABLED: ${{ steps.demo.outputs.enabled }}
        run: |
          set -euo pipefail

          # image references must be lowercase; the GitHub owner name is not
          GHCR_IMAGE="$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          DOCKERHUB_NAMESPACE="$(echo "${DOCKERHUB_NAMESPACE:-}" | tr '[:upper:]' '[:lower:]')"

          if [ "$VARIANT" = "full" ]; then
            suffix=""
          else
            suffix="-$VARIANT"
          fi

          tags="${ODOO_VERSION}${suffix} ${ODOO_VERSION}${suffix}-build${GITHUB_RUN_NUMBER}"
          demo_tags="${ODOO_VERSION}${suffix}-demo"
          if [ "$DEMO_ENABLED" != "true" ]; then
            demo_tags=""
          fi
          if [ "$PUSH_LATEST" = "true" ]; then
            tags="$tags latest${suffix}"
            [ -z "$demo_tags" ] || demo_tags="$demo_tags latest${suffix}-demo"
          fi

          registries="$GHCR_IMAGE"
          if [ "$DOCKERHUB_PUSH" = "true" ] && [ -n "$DOCKERHUB_NAMESPACE" ]; then
            registries="$registries docker.io/${DOCKERHUB_NAMESPACE}/odooplm"
          elif [ "$DOCKERHUB_PUSH" = "true" ]; then
            echo "::warning::DOCKERHUB_NAMESPACE is not set, pushing to GHCR only"
          else
            echo "::warning::Docker Hub credentials not configured, pushing to GHCR only"
          fi

          for image in $registries; do
            for tag in $tags; do
              echo ">>> $image:$tag"
              docker tag odooplm:ci "$image:$tag"
              docker push "$image:$tag"
            done
            for tag in $demo_tags; do
              echo ">>> $image:$tag (demo data)"
              docker tag odooplm:ci-demo "$image:$tag"
              docker push "$image:$tag"
            done
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### OdooPLM ${ODOO_VERSION} (${{ matrix.variant }})"
            echo
            echo '```'
            docker run --rm --entrypoint cat odooplm:ci /etc/odooplm-build-info || true
            echo '```'
            docker images odooplm:ci --format 'image size: {{.Size}}'
          } >> "$GITHUB_STEP_SUMMARY"
