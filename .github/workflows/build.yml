name: build

on:
  push:
    branches: ["18.0"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: ["18.0"]
  workflow_dispatch:
  schedule:
    # weekly rebuild, so the image follows the odooplm branch and the Odoo base image
    - cron: "0 4 * * 1"

env:
  ODOO_VERSION: "18.0"
  ODOOPLM_REF: "18.0"
  # the "latest" tags belong to the branch packaging the newest Odoo release
  PUSH_LATEST: "false"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/odooplm
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'omniasolutions' }}/odooplm

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # the `secrets` context cannot be used in an `if`, so it goes through the job
    # environment, which is available to the step conditions
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # the full variant (cadquery/OCP/vtk) does not fit next to the runner's
        # preinstalled toolchains
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: odooplm:ci
          build-args: |
            ODOO_VERSION=${{ env.ODOO_VERSION }}
            ODOOPLM_REF=${{ env.ODOOPLM_REF }}
            VARIANT=${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test
        run: ./scripts/smoke-test.sh odooplm:ci

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: dockerhub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tags
        if: github.event_name != 'pull_request'
        env:
          VARIANT: ${{ matrix.variant }}
          DOCKERHUB_PUSH: ${{ steps.dockerhub.outcome == 'success' }}
        run: |
          set -euo pipefail

          # image references must be lowercase; the GitHub owner name is not
          GHCR_IMAGE="$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          DOCKERHUB_IMAGE="$(echo "$DOCKERHUB_IMAGE" | tr '[:upper:]' '[:lower:]')"

          if [ "$VARIANT" = "full" ]; then
            suffix=""
          else
            suffix="-$VARIANT"
          fi

          tags="${ODOO_VERSION}${suffix} ${ODOO_VERSION}${suffix}-build${GITHUB_RUN_NUMBER}"
          if [ "$PUSH_LATEST" = "true" ]; then
            tags="$tags latest${suffix}"
          fi

          registries="$GHCR_IMAGE"
          if [ "$DOCKERHUB_PUSH" = "true" ]; then
            registries="$registries $DOCKERHUB_IMAGE"
          else
            echo "::warning::Docker Hub credentials not configured, pushing to GHCR only"
          fi

          for image in $registries; do
            for tag in $tags; do
              echo ">>> $image:$tag"
              docker tag odooplm:ci "$image:$tag"
              docker push "$image:$tag"
            done
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### OdooPLM ${ODOO_VERSION} (${{ matrix.variant }})"
            echo
            echo '```'
            docker run --rm --entrypoint cat odooplm:ci /etc/odooplm-build-info || true
            echo '```'
            docker images odooplm:ci --format 'image size: {{.Size}}'
          } >> "$GITHUB_STEP_SUMMARY"
