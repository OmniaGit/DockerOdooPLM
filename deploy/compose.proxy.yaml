# Reverse proxy overlay: adds Caddy in front of Odoo, with automatic HTTPS.
#
#   docker compose -f compose.yaml -f deploy/compose.proxy.yaml up -d
#
# or, better, put this in .env so every command (and the reset script) picks it
# up on its own:
#
#   COMPOSE_FILE=compose.yaml:deploy/compose.proxy.yaml
#
# Relative paths below are resolved from the repository root, not from deploy/,
# because docker compose takes the directory of the *first* file as the project
# directory.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # Required: the public name the certificate is issued for.
      - ODOOPLM_HOSTNAME=${ODOOPLM_HOSTNAME:?set ODOOPLM_HOSTNAME in .env}
      # Let's Encrypt notifications; optional but recommended.
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Bind mounts on purpose: `docker compose down --volumes` — what the weekly
      # reset runs — must not delete the issued certificates, or the instance
      # would ask Let's Encrypt for a new one every Sunday.
      - ./deploy/caddy/data:/data
      - ./deploy/caddy/config:/config
