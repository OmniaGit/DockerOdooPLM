[options]
; ---------------------------------------------------------------------------
; OdooPLM configuration for a demo server behind your own reverse proxy.
; Copy it over the default one on the server:
;     cp deploy/odoo.public.conf config/odoo.conf
; then edit admin_passwd and restart: docker compose restart odoo
; ---------------------------------------------------------------------------

addons_path = /mnt/odooplm-addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; CHANGE THIS. It protects the database manager, and this server is on the
; internet. Generate one with: openssl rand -base64 24
admin_passwd = CHANGE-ME

; Public server: do not advertise or expose the database list.
list_db = False
dbfilter = ^odooplm$

; Trust X-Forwarded-* so Odoo builds correct URLs and sees the real client
; address. Only ever enable this with a reverse proxy actually in front — and
; make sure that proxy sets X-Forwarded-Proto, or Odoo will build http:// links
; behind your https://.
proxy_mode = True

; Multi-worker mode. Required for the websocket to be served on port 8072 — the
; port your proxy must send /websocket to, and what the chatter and the 3D
; viewer need. At workers = 0 that port does not exist at all.
; Rule of thumb: (2 x CPU cores) + 1, and at least 2.
workers = 4
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

log_level = info
