[options]
; ---------------------------------------------------------------------------
; OdooPLM container configuration.
; This file is mounted at /etc/odoo/odoo.conf — edit it and restart the stack.
; Database connection settings are injected by the entrypoint from the
; HOST / PORT / USER / PASSWORD environment variables of compose.yaml.
; ---------------------------------------------------------------------------

; /mnt/odooplm-addons -> the PLM modules shipped in the image
; /mnt/extra-addons   -> ./addons-extra of this repository, for your own modules
addons_path = /mnt/odooplm-addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; CHANGE THIS before exposing the server: it protects the database manager.
admin_passwd = admin

; Testing defaults: database manager reachable, every database listed.
list_db = True
dbfilter =

; Multi-worker mode. Keep workers = 0 (threaded) for a test server; raise it for
; real use — the PLM CAD client uploads big files, so keep the limits generous.
workers = 0
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; CAD documents are large; do not let Odoo reject the uploads.
; (size in bytes handled by the reverse proxy as well, if you add one)
log_level = info
